[package]
name = "gs1_cca_ccb_scanner"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyd = { version = "0.1.3", default-features = false }
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zedbar = { version = "0.5.1", default-features = false, features = ["databar"] }
